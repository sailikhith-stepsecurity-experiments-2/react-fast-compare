---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      secure-registry:
        description: 'Harden-Runner secure-registry input'
        type: choice
        options: ['false', 'true']
        default: 'false'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node_version:
          - 18
    name: Node ${{ matrix.node_version }} on ${{ matrix.os }}
    steps:
      - name: Harden-Runner
        uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary
        with:
          egress-policy: audit
          secure-registry: ${{ inputs.secure-registry || 'false' }}
      - name: Use LF EOL
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          cache: "yarn"
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Test
        run: yarn test
      - name: Codecov
        run: yarn codecov
